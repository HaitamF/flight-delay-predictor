services:
  api:
    build: .
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models
    environment:
      - WEATHER_API_KEY=${WEATHER_API_KEY}

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config: