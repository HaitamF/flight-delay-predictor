<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flight Delay Predictor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --border: #e0d9c8;
    --text: #2b2620;
    --muted: #8a7f6a;
    --accent: #c1622d;
    --red: #b8433a;
    --green: #4c7a5c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 30px 20px 60px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 26px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 30px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card h2 { font-size: 16px; margin: 0 0 15px; color: var(--text); }
  label { display: block; margin-top: 10px; font-size: 13px; color: var(--muted); }
  input {
    width: 100%; padding: 8px 10px; margin-top: 4px;
    background: #faf8f3; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    margin-top: 20px; padding: 10px 20px; font-size: 14px; font-weight: 600;
    background: var(--accent); color: #fff8f0; border: none; border-radius: 8px;
    cursor: pointer; width: 100%;
  }
  button:hover { opacity: 0.9; }
  #result { margin-top: 16px; padding: 14px; border-radius: 8px; display: none; font-size: 14px; }
  .delayed { background: rgba(229,72,77,0.15); border: 1px solid var(--red); }
  .ontime { background: rgba(70,167,89,0.15); border: 1px solid var(--green); }
  .stat-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { color: var(--muted); }
  .stat-value { font-weight: 600; }
  .dashboard-section { margin-top: 30px; }
  canvas { max-height: 220px; }
  .top-features li { font-size: 13px; margin-bottom: 6px; color: var(--muted); }
  .top-features strong { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">

<h1>Flight Delay Predictor</h1>
<div class="subtitle">XGBoost model trained on 2019 US domestic flights - 96 supported airports</div>
<div style="margin-bottom: 20px;">
  <a href="about.html" style="color: var(--accent); font-size: 13px; font-weight: 600; text-decoration: none; border: 1px solid var(--accent); padding: 6px 14px; border-radius: 6px;">See the full pipeline & decisions →</a>
</div>

<div class="grid">

  <div class="card">
    <h2>Make a Prediction</h2>
    <label>API URL <input id="apiUrl" value="http://127.0.0.1:8000"></label>
    <label>Month (1-12) <input id="MONTH" type="number" value="7"></label>
    <label>Day of Week (1-7) <input id="DAY_OF_WEEK" type="number" value="5"></label>
    <label>Departure Time Block <input id="DEP_TIME_BLK" value="1700-1759"></label>
    <label>Distance Group (1-11) <input id="DISTANCE_GROUP" type="number" value="4"></label>
    <label>Carrier Name <input id="CARRIER_NAME" value="Delta Air Lines Inc."></label>
    <label>Departing Airport <input id="DEPARTING_AIRPORT" value="Atlanta Municipal"></label>
    <button onclick="predict()">Predict</button>
    <div id="result"></div>
  </div>

  <div>
    <div class="card">
      <h2>Model Performance (v2, static)</h2>
      <div id="modelStatsRows"></div>
      <div class="dashboard-section"><canvas id="confusionChart"></canvas></div>
      <div class="dashboard-section">
        <strong style="font-size:13px;">Top features (SHAP)</strong>
        <ul class="top-features" id="topFeaturesList" style="padding-left: 18px; margin-top: 8px;"></ul>
      </div>
    </div>

    <div class="card" style="margin-top: 20px;">
      <h2>Live Usage (this API instance)</h2>
      <div id="liveStatsRows"></div>
      <div class="dashboard-section"><canvas id="liveChart"></canvas></div>
    </div>
  </div>

</div>
</div>

<script>
let confusionChartInstance = null;
let liveChartInstance = null;

async function predict() {
  const resultDiv = document.getElementById("result");
  resultDiv.style.display = "block";
  resultDiv.className = "";
  resultDiv.textContent = "Loading...";

  const payload = {
    MONTH: Number(document.getElementById("MONTH").value),
    DAY_OF_WEEK: Number(document.getElementById("DAY_OF_WEEK").value),
    DEP_TIME_BLK: document.getElementById("DEP_TIME_BLK").value,
    DISTANCE_GROUP: Number(document.getElementById("DISTANCE_GROUP").value),
    CARRIER_NAME: document.getElementById("CARRIER_NAME").value,
    DEPARTING_AIRPORT: document.getElementById("DEPARTING_AIRPORT").value,
  };

  const base = document.getElementById("apiUrl").value.replace(/\/$/, "");

  try {
    const response = await fetch(base + "/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      const err = await response.json();
      resultDiv.textContent = "Error: " + (err.detail || response.statusText);
      return;
    }

    const data = await response.json();
    const pct = (data.delay_probability * 100).toFixed(1);
    resultDiv.className = data.predicted_delayed ? "delayed" : "ontime";

    const e = data.enriched_data;
    resultDiv.innerHTML =
      "<strong>" + (data.predicted_delayed ? "Likely Delayed" : "Likely On Time") + "</strong><br>" +
      "Delay probability: " + pct + "%" +
      "<div style='margin-top:10px; padding-top:10px; border-top:1px solid var(--border); font-size:12px; color:var(--muted);'>" +
      "<strong style='color:var(--text);'>Data fetched by the API for this flight:</strong><br>" +
      "Precipitation: " + e.PRCP + " in &nbsp; | &nbsp; Snow: " + e.SNOW + " in &nbsp; | &nbsp; Max Temp: " + e.TMAX + " °F &nbsp; | &nbsp; Wind: " + e.AWND + " mph<br>" +
      "Carrier avg delay rate: " + (e.carrier_avg_delay * 100).toFixed(1) + "% &nbsp; | &nbsp; " +
      "Airport avg delay rate: " + (e.airport_avg_delay * 100).toFixed(1) + "% &nbsp; | &nbsp; " +
      "Day avg delay rate: " + (e.day_avg_delay * 100).toFixed(1) + "% &nbsp; | &nbsp; " +
      "Timeblock avg delay rate: " + (e.timeblock_avg_delay * 100).toFixed(1) + "%" +
      "</div>";

    loadLiveStats();
  } catch (e) {
    resultDiv.textContent = "Request failed: " + e.message;
  }
}

async function loadModelStats() {
  const base = document.getElementById("apiUrl").value.replace(/\/$/, "");
  try {
    const res = await fetch(base + "/model-stats");
    const stats = await res.json();

    document.getElementById("modelStatsRows").innerHTML =
      '<div class="stat-row"><span class="stat-label">Model version</span><span class="stat-value">' + stats.model_version + '</span></div>' +
      '<div class="stat-row"><span class="stat-label">Features used</span><span class="stat-value">' + stats.features_used + '</span></div>' +
      '<div class="stat-row"><span class="stat-label">Recall (delayed)</span><span class="stat-value">' + stats.recall_delayed + '</span></div>' +
      '<div class="stat-row"><span class="stat-label">Precision (delayed)</span><span class="stat-value">' + stats.precision_delayed + '</span></div>' +
      '<div class="stat-row"><span class="stat-label">Accuracy</span><span class="stat-value">' + stats.accuracy + '</span></div>';

    const cm = stats.confusion_matrix;
    if (confusionChartInstance) confusionChartInstance.destroy();
    confusionChartInstance = new Chart(document.getElementById("confusionChart"), {
      type: "bar",
      data: {
        labels: ["True Neg", "False Pos", "True Pos", "False Neg"],
        datasets: [{
          data: [cm.true_negative, cm.false_positive, cm.true_positive, cm.false_negative],
          backgroundColor: ["#4c7a5c", "#b8433a", "#4c7a5c", "#b8433a"]
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: { y: { ticks: { color: "#8b93a3" } }, x: { ticks: { color: "#8b93a3" } } }
      }
    });

    document.getElementById("topFeaturesList").innerHTML = stats.top_features
      .map(function(f) { return "<li><strong>" + f.name + "</strong> - " + f.note + "</li>"; }).join("");
  } catch (e) {
    document.getElementById("modelStatsRows").textContent = "Could not load model stats.";
  }
}

async function loadLiveStats() {
  const base = document.getElementById("apiUrl").value.replace(/\/$/, "");
  try {
    const res = await fetch(base + "/stats");
    const stats = await res.json();

    document.getElementById("liveStatsRows").innerHTML =
      '<div class="stat-row"><span class="stat-label">Total predictions made</span><span class="stat-value">' + stats.total + '</span></div>' +
      '<div class="stat-row"><span class="stat-label">Predicted delayed</span><span class="stat-value">' + stats.predicted_delayed + '</span></div>' +
      '<div class="stat-row"><span class="stat-label">Predicted on time</span><span class="stat-value">' + stats.predicted_on_time + '</span></div>';

    if (liveChartInstance) liveChartInstance.destroy();
    liveChartInstance = new Chart(document.getElementById("liveChart"), {
      type: "doughnut",
      data: {
        labels: ["Predicted Delayed", "Predicted On Time"],
        datasets: [{
          data: [stats.predicted_delayed, stats.predicted_on_time],
          backgroundColor: ["#b8433a", "#4c7a5c"]
        }]
      },
      options: { plugins: { legend: { labels: { color: "#8b93a3" } } } }
    });
  } catch (e) {
    document.getElementById("liveStatsRows").textContent = "Could not load live stats (API may be offline).";
  }
}

loadModelStats();
loadLiveStats();
</script>

</body>
</html>
